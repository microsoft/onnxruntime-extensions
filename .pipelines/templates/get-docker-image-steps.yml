# calls tools/utils/get_docker_image.py

parameters:
- name: Dockerfile
  type: string
- name: Context
  type: string
- name: DockerBuildArgs
  type: string
  default: ""
- name: Repository
  type: string
- name: UseImageCacheContainerRegistry
  type: boolean
  default: true
- name: UsePipelineCache
  type: boolean
  default: false
- name: ScriptName
  type: string
  default: "tools/utils/get_docker_image.py"
- name: UpdateDepsTxt
  type: boolean
  default: true
- name: IMAGE_CACHE_DIR
  type: string
  default: $(Agent.TempDirectory)/docker

steps:

- script: |
    docker image ls
    docker system df
  displayName: Check Docker Images

- task: Docker@2
  inputs:
    containerRegistry: onnxruntimebuildcache_token
    command: login
    addPipelineData: false
  displayName: Log in to container registry
  condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))

- script: |
    python ${{ parameters.ScriptName }} \
      --dockerfile "${{ parameters.Dockerfile }}" \
      --context "${{ parameters.Context }}" \
      --docker-build-args "${{ parameters.DockerBuildArgs }}" \
      --container-registry onnxruntimebuildcache \
      --repository "${{ parameters.Repository }}"
  displayName: "Get ${{ parameters.Repository }} image for ${{ parameters.Dockerfile }}"
  condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))

- script: |
    python ${{ parameters.ScriptName }} \
      --dockerfile "${{ parameters.Dockerfile }}" \
      --context "${{ parameters.Context }}" \
      --docker-build-args "${{ parameters.DockerBuildArgs }}" \
      --repository "${{ parameters.Repository }}"
  displayName: "Build ${{ parameters.Repository }} image locally"
  condition: and(succeeded(), eq(variables['System.PullRequest.IsFork'], 'True'))

- task: Docker@2
  inputs:
    containerRegistry: onnxruntimebuildcache_token
    command: logout
    addPipelineData: false
  displayName: Log out of container registry
  condition: and(always(), ne(variables['System.PullRequest.IsFork'], 'True'))